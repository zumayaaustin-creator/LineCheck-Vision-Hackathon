# Cloudflare Worker: OpenAI-compatible face over Workers AI's Llama 3.2 11B Vision.
#
# Why a Worker instead of calling the Workers AI REST API directly:
#   1. Workers AI's OpenAI-compatible shim is documented for TEXT models only, so whether
#      `image_url` content parts survive it is unproven. Here the translation is ours and explicit.
#   2. The AI binding needs no API token, so there is no long-lived credential sitting in the proxy
#      env or on disk - the only secret is the bearer WE choose, and it is optional.
#   3. Same handler can be redeployed with a different model id without touching the proxy.
name = "linecheck-fallback"
main = "src/index.mjs"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"

# The model id the proxy receives from /v1/models.
[vars]
MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
SERVED_MODEL_NAME = "llama-3.2-11b-vision"

[observability]
enabled = true
